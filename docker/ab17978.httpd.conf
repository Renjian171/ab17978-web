# =============================================================================
#  Ab17978 容器内 Apache + mod_wsgi 配置（cluster 模式专用）
#  装载位置：/etc/httpd/conf.d/ab17978.conf（系统 httpd 自动 Include）
#
#  核心点：WSGIScriptAlias /ab17978 /home/rjtian/ab17978-web/myweb/wsgi.py
#    mod_wsgi 会自动把 SCRIPT_NAME 设为 /ab17978、PATH_INFO 剥掉前缀，
#    Django 的 URL 路由与 reverse() 自动带前缀——
#    因此无需改 urls.py、无需 FORCE_SCRIPT_NAME、STATIC_URL 保持 '/static/' 即可。
#    （13 节点 GT42 / KPGF / LncNexus / GenomeSyn 等 Django 站统一此法。）
#
#  静态资源与 SPA 回退仍由 whitenoise 负责（见 settings.py）：
#    - /ab17978/static/*   → whitenoise（STATIC_ROOT）
#    - /ab17978/*          → 回退 dist/index.html（Vue history 模式）
# =============================================================================

# mod_wsgi 守护进程：固定 Python 解释器与项目路径
WSGISocketPrefix /var/run/wsgi

WSGIDaemonProcess ab17978-web \
    python-home=/opt/mambaforge/envs/ab17978 \
    python-path=/home/rjtian/ab17978-web
WSGIProcessGroup ab17978-web
WSGIScriptAlias /ab17978 /home/rjtian/ab17978-web/myweb/wsgi.py

# 放行 wsgi.py 访问
<Directory /home/rjtian/ab17978-web/myweb>
    <Files wsgi.py>
        Require all granted
    </Files>
</Directory>

# 网关铁律 #4：隐藏目录索引（禁止目录列表）
# 同时放行家目录，让 httpd 能穿透到挂载的 dist / bacteria
<Directory /home/rjtian>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
